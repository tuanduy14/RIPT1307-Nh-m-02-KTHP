
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phân công công việc — Dự án Mượn Thiết Bị</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0; --bg2: #ffffff; --border: #e2e0d8;
    --text: #1a1916; --text2: #6b6960; --text3: #9c9a92;
    --be: #1a4f8a; --be-bg: #e8f0fb; --be-border: #b8d0f0;
    --fe: #1a6b3a; --fe-bg: #e6f4ec; --fe-border: #a8d8ba;
    --dev: #5a3a8a; --dev-bg: #f0ebfb; --dev-border: #c8b8ee;
    --qa: #8a5a1a; --qa-bg: #faf0e0; --qa-border: #e8c888;
    --cao: #c0392b; --cao-bg: #fdecea; --cao-border: #f5b8b2;
    --tb: #b8620a; --tb-bg: #fef3e2; --tb-border: #f0d090;
    --thp: #5a5a52; --thp-bg: #f2f1ec; --thp-border: #d0cfc8;
    --duy-c: #5a4a9a; --duy-bg: #eeebfb;
    --bach-c: #1a7a5a; --bach-bg: #e2f5ee;
    --dai-c: #1a5a8a; --dai-bg: #e2eef8;
    --quang-c: #8a6a1a; --quang-bg: #f8f0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 24px 60px; }

  header { max-width: 1100px; margin: 0 auto 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  .project-label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  h1 { font-size: 26px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text2); margin-bottom: 14px; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text2); }
  .stat-num { font-size: 17px; font-weight: 600; color: var(--text); }

  /* board */
  .board { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
  .board.view-member { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 700px) { .board { grid-template-columns: 1fr !important; } }

  .col { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .col-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .av-duy   { background: var(--duy-bg);   color: var(--duy-c); }
  .av-bach  { background: var(--bach-bg);  color: var(--bach-c); }
  .av-dai   { background: var(--dai-bg);   color: var(--dai-c); }
  .av-quang { background: var(--quang-bg); color: var(--quang-c); }
  .col-info { flex: 1; min-width: 0; }
  .col-name { font-size: 14px; font-weight: 600; }
  .col-role { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .col-count { font-size: 11px; font-weight: 600; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; color: var(--text2); }
  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 7px; }

  /* card */
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; background: var(--bg); }
  .card:hover { border-color: #b0ada4; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .card-title { font-size: 12.5px; font-weight: 500; line-height: 1.4; }
  .prio { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 2px 6px; white-space: nowrap; flex-shrink: 0; }
  .p-cao { background: var(--cao-bg); color: var(--cao); border: 1px solid var(--cao-border); }
  .p-tb  { background: var(--tb-bg);  color: var(--tb);  border: 1px solid var(--tb-border); }
  .p-thp { background: var(--thp-bg); color: var(--thp); border: 1px solid var(--thp-border); }
  .card-meta { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .type-tag { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 5px; }
  .t-be  { background: var(--be-bg);  color: var(--be);  border: 1px solid var(--be-border); }
  .t-fe  { background: var(--fe-bg);  color: var(--fe);  border: 1px solid var(--fe-border); }
  .t-dev { background: var(--dev-bg); color: var(--dev); border: 1px solid var(--dev-border); }
  .t-qa  { background: var(--qa-bg);  color: var(--qa);  border: 1px solid var(--qa-border); }
  .card-file { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); word-break: break-all; }

  /* owner chip */
  .owner-chip { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 6px; }
  .oc-duy   { background: var(--duy-bg);   color: var(--duy-c); }
  .oc-bach  { background: var(--bach-bg);  color: var(--bach-c); }
  .oc-dai   { background: var(--dai-bg);   color: var(--dai-c); }
  .oc-quang { background: var(--quang-bg); color: var(--quang-c); }

  /* modal */
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal-backdrop.open { display:flex; }
  .modal { background: var(--bg2); border-radius: 14px; border: 1px solid var(--border); max-width: 480px; width: 100%; padding: 24px; position: relative; box-shadow: 0 8px 40px rgba(0,0,0,.15); }
  .modal-close { position:absolute; top:14px; right:16px; font-size:18px; cursor:pointer; color:var(--text3); background:none; border:none; line-height:1; padding:4px; }
  .modal-close:hover { color:var(--text); }
  .modal-title { font-size:16px; font-weight:600; margin-bottom:6px; padding-right:24px; line-height:1.4; }
  .modal-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .modal-section { margin-bottom:12px; }
  .modal-section-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:5px; }
  .modal-section-body { font-size:13px; color:var(--text2); line-height:1.6; }
  .modal-file { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; }

  .legend { max-width:1100px; margin:24px auto 0; display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--text2); padding-top:18px; border-top:1px solid var(--border); }
  .leg { display:flex; align-items:center; gap:4px; }
  .leg-dot { width:8px; height:8px; border-radius:2px; }
  .legend-sep { color:var(--border); }
</style>
</head>
<body>

<header>
  <div class="project-label">Phân công công việc</div>
  <h1>Hệ thống Mượn Thiết Bị</h1>
  <div class="subtitle">Express · PostgreSQL · React · UmiJS · Ant Design · Resend</div>
  <div class="stats">
    <span><span class="stat-num">27</span> tasks</span>
    <span>·</span>
    <span><span class="stat-num">4</span> thành viên</span>
    <span>·</span>
    <span class="type-tag t-be">Backend</span> 10
    <span class="type-tag t-fe">Frontend</span> 11
    <span class="type-tag t-dev">DevOps</span> 3
    <span class="type-tag t-qa">QA</span> 2
  </div>
</header>

<div class="board view-member" id="board"></div>

<div class="legend">
  <div class="leg"><span class="leg-dot" style="background:#b8d0f0"></span> Backend</div>
  <div class="leg"><span class="leg-dot" style="background:#a8d8ba"></span> Frontend</div>
  <div class="leg"><span class="leg-dot" style="background:#c8b8ee"></span> DevOps</div>
  <div class="leg"><span class="leg-dot" style="background:#e8c888"></span> QA/UX</div>
  <span class="legend-sep">|</span>
  <div class="leg"><span class="leg-dot" style="background:#f5b8b2"></span> Ưu tiên cao</div>
  <div class="leg"><span class="leg-dot" style="background:#f0d090"></span> Trung bình</div>
  <div class="leg"><span class="leg-dot" style="background:#d0cfc8"></span> Thấp</div>
</div>

<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-tags" id="m-tags"></div>
    <div class="modal-section">
      <div class="modal-section-label">Mô tả</div>
      <div class="modal-section-body" id="m-desc"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">File liên quan</div>
      <div class="modal-file" id="m-file"></div>
    </div>
    <div class="modal-section" id="m-dep-wrap">
      <div class="modal-section-label">Phụ thuộc</div>
      <div class="modal-section-body" id="m-dep"></div>
    </div>
  </div>
</div>

<script>

const tasks = [
  {id:1,  title:"Thiết kế & khởi tạo Database",      owner:"duy",   prio:"cao", type:"be",  file:"database/schema.sql",       meta:"users, equipments, requests",       desc:"Viết schema SQL đầy đủ cho 3 bảng: users, equipments, requests. Định nghĩa enum request_status (pending/approved/returned). Thiết lập foreign key, index.", dep:"Không phụ thuộc — làm trước tiên"},
  {id:2,  title:"API xác thực (Auth)",                owner:"duy",   prio:"cao", type:"be",  file:"routes/auth.ts",                    meta:"POST /api/auth/login",               desc:"Xử lý đăng nhập bằng email + bcrypt. So sánh password_hash, trả về user object (loại bỏ password_hash). Trả lỗi 401 nếu sai thông tin.", dep:"Task 1 (Database)"},
  {id:3,  title:"API thiết bị (Equipment)",           owner:"duy",   prio:"cao", type:"be",  file:"routes/equipment.ts · models/equipment.ts", meta:"GET /api/equipments, /stats", desc:"GET /api/equipments trả danh sách thiết bị còn hàng. GET /api/equipments/stats trả thống kê số lượng yêu cầu theo tháng.", dep:"Task 1, Task 7"},
  {id:4,  title:"API yêu cầu mượn (Request)",         owner:"duy",   prio:"cao", type:"be",  file:"routes/request.ts",                 meta:"POST, GET /mine, approve, return",  desc:"POST / tạo yêu cầu mới (trừ tồn kho). GET /mine lấy yêu cầu của sinh viên. GET / lấy tất cả (admin). POST /:id/approve duyệt. POST /:id/return hoàn trả (cộng lại tồn kho).", dep:"Task 1, Task 2, Task 3"},
  {id:5,  title:"Gửi email thông báo (Resend)",       owner:"duy",   prio:"tb",  type:"be",  file:"mailer.ts · notifications.ts",      meta:"Resend SDK, notify admin/student",  desc:"Dùng Resend SDK gửi mail khi có yêu cầu mới (notifyAdminNewRequest) và khi được duyệt (notifyStudentApproved). Đọc RESEND_API_KEY từ .env.", dep:"Task 4, Task 9 (HTML template)"},
  {id:6,  title:"Thiết kế HTML email template",       owner:"duy",   prio:"tb",  type:"be",  file:"templates/email/",                  meta:"new-request, approved, overdue",    desc:"3 template: new-request.html (gửi admin), approved.html (gửi sinh viên), overdue-warning.html (cảnh báo quá hạn). Dùng inline style, layout table để tương thích Outlook.", dep:"Không phụ thuộc, nên làm song song task 5"},
  {id:7,  title:"Cron job nhắc nhở quá hạn",          owner:"duy",   prio:"tb",  type:"be",  file:"notifications.ts · index.ts",       meta:"24h interval, mail cảnh báo",       desc:"setInterval chạy mỗi 24h, query các request đã quá return_date mà chưa returned. Gọi notifyAdminOverdue và notifyStudentDueSoon.", dep:"Task 4, Task 5"},

  {id:10, title:"Middleware xác thực & CORS",         owner:"duy",   prio:"thp", type:"be",  file:"index.ts",                          meta:"cors(), body-parser, DB check",     desc:"Cấu hình cors() cho phép origin frontend (Render URL). Kiểm tra kết nối DB khi khởi động server. Thêm middleware kiểm tra session/token bảo vệ route.", dep:"Task 8"},
  {id:11, title:"Trang đăng nhập",                    owner:"duy",   prio:"cao", type:"fe",  file:"pages/Login/index.tsx · style.less", meta:"login(), localStorage, redirect",  desc:"Form email + password với validation. Gọi login() từ service layer. Lưu user vào localStorage. Redirect admin → /admin, sinh viên → /student.", dep:"Task 2, Task 18 (Service layer)"},

  {id:13, title:"Header / Right Content",             owner:"duy",   prio:"tb",  type:"fe",  file:"components/RightContent/index.tsx", meta:"Avatar, dropdown, logout",          desc:"Hiển thị tên và avatar (dựa theo role). Dropdown menu có nút Đăng xuất — xóa localStorage và redirect về /login.", dep:"Task 11"},

  {id:17, title:"Seed dữ liệu mẫu",                   owner:"duy",   prio:"cao", type:"dev", file:"database/schema.sql",               meta:"bcrypt hash, INSERT users/equip",   desc:"INSERT 1 tài khoản admin, 2-3 sinh viên mẫu với password đã bcrypt hash. INSERT 5-10 thiết bị mẫu với số lượng khác nhau.", dep:"Task 1"},
  {id:18, title:"Quản lý yêu cầu (Admin)",            owner:"bach",  prio:"cao", type:"fe",  file:"pages/Admin/Requests.tsx",          meta:"approveRequest, Popconfirm",        desc:"Table hiển thị tất cả yêu cầu. Lọc theo trạng thái pending/approved/returned. Nút Duyệt có Popconfirm xác nhận. Badge màu theo trạng thái.", dep:"Task 14 (Service layer)"},
  {id:19, title:"Quản lý thiết bị (Admin)",           owner:"bach",  prio:"tb",  type:"fe",  file:"pages/Admin/Devices.tsx",           meta:"CRUD, modal thêm/sửa",              desc:"Table danh sách thiết bị. Modal thêm mới và chỉnh sửa. Nút điều chỉnh số lượng. Gọi getEquipments(), createEquipment(), updateEquipment().", dep:"Task 14, Task 9"},

  {id:21, title:"Viết tài liệu & báo cáo (Admin)",   owner:"bach",  prio:"thp", type:"dev", file:"README.md",                                                 meta:"Phần Admin, API docs",              desc:"Mô tả các tính năng Admin trong README. Viết API docs cho các endpoint /api/equipments và /api/requests.", dep:"Sau khi hoàn thành task 18,19,20"},
  {id:22, title:"Dashboard sinh viên",                owner:"dai",   prio:"tb",  type:"fe",  file:"pages/Student/Dashboard.tsx",       meta:"Statistic card, gọi API",           desc:"Hiển thị 3 Statistic card: tổng thiết bị có sẵn, số yêu cầu đang chờ duyệt, số thiết bị đang mượn. Gọi API thực thay hardcode.", dep:"Task 14"},

const memberCols = [
  { key:"duy",  av:"av-duy",  name:"Đào Tuấn Duy",    role:"Backend · Frontend core · DevOps" },
  { key:"bach",  av:"av-bach",  name:"Lê Xuân Bách",      role:"Frontend Admin" },
  { key:"dai",   av:"av-dai",  name:"Lê Đức Đại",        role:"Frontend Student" },
  { key:"quang", av:"av-quang", name:"Nguyễn Minh Quang", role:"QA · UI/UX · Tài liệu" },
];

function buildCard(t) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <div class="card-top">
      <span class="card-title">${t.title}</span>
      <span class="prio p-${t.prio}">${pmap[t.prio]}</span>
    </div>
    <div class="card-meta">${t.meta} <span class="type-tag t-${t.type}">${tmap[t.type]}</span></div>
    <div class="card-file">${t.file}</div>`;
  div.onclick = () => openModal(t);
  return div;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.className = 'board view-member';

  memberCols.forEach(col => {
    const filtered = tasks.filter(t => t.owner === col.key);

    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.innerHTML = `
      <div class="col-head">
        <div class="avatar ${col.av}">${col.name[0]}</div>
        <div class="col-info">
          <div class="col-name">${col.name}</div>
          <div class="col-role">${col.role}</div>
        </div>
        <div class="col-count">${filtered.length} tasks</div>
      </div>
      <div class="col-body"></div>`;
    const body = colEl.querySelector('.col-body');
    filtered.forEach(t => body.appendChild(buildCard(t)));
    board.appendChild(colEl);
  });
}

function openModal(t) {
  document.getElementById('m-title').textContent = t.title;
  document.getElementById('m-tags').innerHTML = `
    <span class="prio p-${t.prio}">${pmap[t.prio]}</span>
    <span class="type-tag t-${t.type}">${tmap[t.type]}</span>
    <span class="owner-chip oc-${t.owner}">${ownerName[t.owner]}</span>`;
  document.getElementById('m-desc').textContent = t.desc;
  document.getElementById('m-file').textContent = t.file;
  document.getElementById('m-dep').textContent = t.dep;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
}


renderBoard();
</script>
</body>
</html>
